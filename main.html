<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Library</title>

  <style>
    body {
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
    }

    .book-library {
      background-color: #ffffff;
      padding: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .book {
      text-align: center;
      width: 150px;
    }

    .book img {
      width: 150px;
      height: 200px;
      object-fit: cover;
    }

    /* IMPORTANT: No extra classes */
    .book p {
      color: #777777;
    }

    /* Price must be last <p> */
    .book p:last-child {
      color: #2ecc71;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <div class="book-library">

    <div class="book">
      <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Spy-in-the-Amber-by-Manohar-Malgonkar.jpg">
      <h3>Spy in the Amber</h3>
      <p>Manohar Malgonkar</p>
      <p>₹299</p>
    </div>

    <div class="book">
      <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Sacred-Games-by-Vikram-Chandra.jpg">
      <h3>Sacred Games</h3>
      <p>Vikram Chandra</p>
      <p>₹399</p>
    </div>

    <div class="book">
      <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Byomkesh-Bakshi-by-Sharadindu-Bandyopadhyay.jpg">
      <h3>Byomkesh Bakshi</h3>
      <p>Sharadindu Bandyopadhyay</p>
      <p>₹249</p>
    </div>

  </div>

</body>
</html>
