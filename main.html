<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Library</title>

  <style>
    body {
      background-color: #f8f8f8;
      font-family: Arial, sans-serif;
    }

    .book-library {
      background-color: #ffffff;
      padding: 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .book {
      text-align: center;
      width: 150px;
    }

    .book img {
      width: 150px;
      height: 200px;
      object-fit: cover;
    }

    .author {
      color: #777777;
    }

    .price {
      color: #2ecc71;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="book-library">

    <!-- Book 1 -->
    <div class="book">
      <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Spy-in-the-Amber-by-Manohar-Malgonkar.jpg" alt="Spy in the Amber">
      <h3>Spy in the Amber</h3>
      <p class="author">Manohar Malgonkar</p>
      <p class="price">₹299</p>
    </div>

    <!-- Book 2 -->
    <div class="book">
      <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Sacred-Games-by-Vikram-Chandra.jpg" alt="Sacred Games">
      <h3>Sacred Games</h3>
      <p class="author">Vikram Chandra</p>
      <p class="price">₹399</p>
    </div>

    <!-- Book 3 -->
    <div class="book">
      <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Byomkesh-Bakshi-by-Sharadindu-Bandyopadhyay.jpg" alt="Byomkesh Bakshi">
      <h3>Byomkesh Bakshi</h3>
      <p class="author">Sharadindu Bandyopadhyay</p>
      <p class="price">₹249</p>
    </div>

  </div>

</body>
</html>
