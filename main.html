<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Library</title>

  <style>
    body {
      background-color: #f8f8f8;
      margin: 0;
      padding: 20px;
    }

    .book-library {
      background-color: #ffffff;
	  width: 90%;
	  margin: auto;
      padding: 20px;
      box-shadow: 0 0 10px #ccc;
    }
	  h1{
		  text-align: centre;
	  }

    .book {
      background-color: #f0f0f0;
      padding: 20px;
      margin-bottom: 20px;
    }

    .book img {
      display: block;
      margin: auto;
      width: 200px;
      height: 300px;
    }

    /* IMPORTANT: No extra classes */
    .book h2 {
		margin-bottom: 0
	}

   .author {
      color: #777777;
      margin-top: 0;
    }

    .price {
    background-color: #2ecc71;
    color: white !important;
    text-align: center;
    padding: 10px;
    font-weight: bold;
    border-radius: 4px;
}
    
  </style>
</head>

<body>

  <div class="book-library">

    <div class="book">
      <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Spy-in-the-Amber-by-Manohar-Malgonkar.jpg">
      <h3>Spy in the Amber</h3>
      <p>Manohar Malgonkar</p>
      <p>₹299</p>
    </div>

    <div class="book">
      <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Sacred-Games-by-Vikram-Chandra.jpg">
      <h3>Sacred Games</h3>
      <p>Vikram Chandra</p>
      <p>₹399</p>
    </div>

    <div class="book">
      <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Byomkesh-Bakshi-by-Sharadindu-Bandyopadhyay.jpg">
      <h3>Byomkesh Bakshi</h3>
      <p>Sharadindu Bandyopadhyay</p>
      <p>₹249</p>
    </div>

  </div>

</body>
</html>
